{{- if eq (.Values.existingSecret | default "") "email-notification-provider-secret" -}}
{{- fail "existingSecret must differ from the chart-managed email-notification-provider-secret; create the existing bundle under a new name before upgrading" -}}
{{- end -}}
{{- if not .Values.existingSecret -}}
apiVersion: v1
data:
  # if the global values are defined, use it, otherwise use local values
  dbPassword: {{ pluck "password" .Values.global.database .Values.database | compact | first | b64enc | quote }}
  dbUsername: {{ pluck "username" .Values.global.database .Values.database | compact | first | b64enc | quote }}
  smtpPassword: {{ .Values.smtp.password | b64enc | quote }}
  smtpUsername: {{ .Values.smtp.username | b64enc | quote }}
kind: Secret
metadata:
  name: email-notification-provider-secret
{{- end }}