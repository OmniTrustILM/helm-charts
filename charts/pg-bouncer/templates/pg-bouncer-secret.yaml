{{- if eq (.Values.database.existingSecret | default "") "pg-bouncer-secret" -}}
{{- fail "database.existingSecret must differ from the chart-managed pg-bouncer-secret; create the existing bundle under a new name before upgrading" -}}
{{- end -}}
{{- if not .Values.database.existingSecret -}}
apiVersion: v1
stringData:
  userlist.txt: |-
    {{- include "pg-bouncer.userlist.txt" . | indent 4 }}
kind: Secret
metadata:
  name: pg-bouncer-secret
{{- end }}