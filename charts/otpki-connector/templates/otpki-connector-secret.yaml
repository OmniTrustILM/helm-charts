{{- if eq (.Values.existingSecret | default "") "otpki-connector-secret" -}}
{{- fail "existingSecret must differ from the chart-managed otpki-connector-secret; create the existing bundle under a new name before upgrading" -}}
{{- end -}}
{{- if not .Values.existingSecret -}}
{{- if .Values.otpki.loginPasswordKey }}
apiVersion: v1
kind: Secret
metadata:
  name: otpki-connector-secret
data:
  login_password_key: {{ .Values.otpki.loginPasswordKey | b64enc | quote }}
{{- end }}
{{ end }}