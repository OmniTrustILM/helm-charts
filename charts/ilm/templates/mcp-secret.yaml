{{- /*
MCP's client secret from global.mcp.clientSecret, in either identity mode, under the name and key that the MCP chart reads
for it. This file is rendered on every install, so the checks of the MCP values run from here.
*/ -}}
{{- if eq (include "ilm.mcp.enabled" .) "true" -}}
{{- include "ilm.mcp.validate" . -}}
{{- if .Values.global.mcp.clientSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: mcp-server-secret
data:
  client-secret: {{ .Values.global.mcp.clientSecret | b64enc | quote }}
{{- end }}
{{- end }}
