{{- if eq (.Values.existingSecret | default "") "software-cryptography-provider-secret" -}}
{{- fail "existingSecret must differ from the chart-managed software-cryptography-provider-secret; create the existing bundle under a new name before upgrading" -}}
{{- end -}}
{{- if not .Values.existingSecret -}}
apiVersion: v1
data:
  # if the global values are defined, use it, otherwise use local values
  password: {{ pluck "password" .Values.global.database .Values.database | compact | first | b64enc | quote }}
  username: {{ pluck "username" .Values.global.database .Values.database | compact | first | b64enc | quote }}
  {{- if .Values.encryptionKey }}
  encryption_key: {{ .Values.encryptionKey | b64enc | quote }}
  {{- end }}
kind: Secret
metadata:
  name: software-cryptography-provider-secret
{{- end }}