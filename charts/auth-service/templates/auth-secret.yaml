{{- if eq (.Values.database.existingSecret | default "") "auth-secret" -}}
{{- fail "database.existingSecret must differ from the chart-managed auth-secret; create the existing bundle under a new name before upgrading" -}}
{{- end -}}
{{- if not .Values.database.existingSecret -}}
apiVersion: v1
data:
  # if the global values are defined, use it, otherwise use local values
  connection-string: {{ include "ilm-lib.util.format.netUrl" (list . ) | b64enc }}
kind: Secret
metadata:
  name: auth-secret
{{ end }}