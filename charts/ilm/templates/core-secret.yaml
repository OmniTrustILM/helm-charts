{{- if eq (.Values.database.existingSecret | default "") "core-secret" -}}
{{- fail "database.existingSecret must differ from the chart-managed core-secret; create the existing bundle under a new name before upgrading" -}}
{{- end -}}
{{- if not .Values.database.existingSecret -}}
{{- $username := pluck "username" .Values.global.database .Values.database | compact | first | b64enc | quote }}
{{- $password := pluck "password" .Values.global.database .Values.database | compact | first | b64enc | quote }}
apiVersion: v1
data:
  jdbcPassword: {{ $password }}
  jdbcUsername: {{ $username }}
kind: Secret
metadata:
  name: core-secret
{{- end }}