{{- $registerKeycloak := eq (include "ilm.registerInternalKeycloak" .) "true" }}
{{- $scripts := or $registerKeycloak .Values.registerAdmin.enabled }}
{{- if $scripts }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: core-scripts-configmap
data:
  {{- if .Values.registerAdmin.enabled }}
  register-admin.sh: |
    {{- tpl (.Files.Get "scripts/register-admin.sh") . | indent 4 }}
  {{- end }}
  {{- if $registerKeycloak }}
  register-internal-keycloak.sh: |
    {{- tpl (.Files.Get "scripts/register-internal-keycloak.sh") . | indent 4 }}
  {{- end }}
{{- end }}
