{{- $existing := pluck "existingSecret" .Values.global.messaging .Values.messaging | compact | first -}}
{{- if or (eq ($existing | default "") "messaging-secret") (eq ($existing | default "") (printf "messaging-secret-%s" (.Chart.Name | lower))) -}}
{{- fail "global.messaging.existingSecret or messaging.existingSecret must differ from chart-managed messaging Secret names; create the existing bundle under a new name before upgrading" -}}
{{- end -}}
{{- if not (pluck "existingSecret" .Values.global.messaging .Values.messaging | compact | first) -}}
{{- if not .Values.global.config.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: messaging-secret-{{ .Chart.Name | lower }}
stringData:
  messaging.username: {{ pluck "username" .Values.global.messaging .Values.messaging | compact | first | quote }}
  messaging.password: {{ pluck "password" .Values.global.messaging .Values.messaging | compact | first | quote }}
  messaging.cookie: {{ .Values.messaging.erlang.cookie | quote }}
  messaging.definitions.json: |-
    {{- include "messaging-rabbitmq.definitions.json" (dict "global" .Values.global "messagingService" .Values) | indent 4 }}
{{- end }}
{{ end }}