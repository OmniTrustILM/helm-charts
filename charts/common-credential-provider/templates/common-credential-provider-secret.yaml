{{- if eq (.Values.existingSecret | default "") "common-credential-provider-secret" -}}
{{- fail "existingSecret must differ from the chart-managed common-credential-provider-secret; create the existing bundle under a new name before upgrading" -}}
{{- end -}}
{{- if not .Values.existingSecret -}}
apiVersion: v1
data:
  # if the global values are defined, use them, otherwise use local values
  password: {{ pluck "password" .Values.global.database .Values.database | compact | first | b64enc | quote }}
  username: {{ pluck "username" .Values.global.database .Values.database | compact | first | b64enc | quote }}
kind: Secret
metadata:
  name: common-credential-provider-secret
{{ end }}